onboarding = false

# Default workspace panes are provisioned by plugins/default-workspace-layout.

[theme]
name = "tokyo-night"

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true

[keys]
# tmux-style bindings (prefix is the leader, default ctrl+b)
split_vertical = "prefix+|"
detach = "prefix+d"

# vim-style j/k move the selection up/down inside the spaces picker
# (frees pane up/down in navigate mode; use arrows or ctrl+b j/k for pane focus)
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = ""
navigate_pane_down = ""

# leader+. / leader+, step to the next / previous agent in the panel
next_agent = "prefix+."
previous_agent = "prefix+,"

close_workspace = "prefix+shift+w"
remove_worktree = "prefix+shift+d"

[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "ctrl+\\"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "third774.sidepulse.toggle"
description = "toggle SidePulse"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

